version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mrdu-postgres
    environment:
      POSTGRES_USER: mrdu
      POSTGRES_PASSWORD: mrdu
      POSTGRES_DB: mrdu
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mrdu"]
      interval: 5s
      timeout: 5s
      retries: 5

  chroma:
    image: chromadb/chroma:latest
    container_name: mrdu-chroma
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/data
    environment:
      - CHROMA_SERVER_HOST=0.0.0.0
      - CHROMA_SERVER_HTTP_PORT=8000
      - ALLOW_RESET=TRUE

volumes:
  postgres_data:
  chroma_data: